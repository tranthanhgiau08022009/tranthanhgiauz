services:
  app:
    build: .
    container_name: digital-store-pro-app
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5000
      MONGO_URI: mongodb://mongo:27017/digital_store_pro
      JWT_SECRET: ${JWT_SECRET:-thay_doi_chuoi_bi_mat_cuc_manh}
      JWT_EXPIRES_IN: 7d
      COOKIE_NAME: dsp_token
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-thay_doi_webhook_secret}
      TOKEN_RATE_VND: ${TOKEN_RATE_VND:-1000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Doi_Mat_Khau_Admin_123}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-false}
    volumes:
      - uploads-data:/app/public/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: digital-store-pro-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
  uploads-data:
